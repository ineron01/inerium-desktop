# Hyprlock — Inerium Dragon, в стиле Центра управления и попапов
# Размытый снимок экрана + центральная карточка: время, дата, пароль, статус.

general {
    hide_cursor = true
    ignore_empty_input = true
}

animations {
    enabled = true
    bezier = soft, 0.4, 0, 0.2, 1
    animation = fadeIn, 1, 4, soft
    animation = fadeOut, 1, 4, soft
    animation = inputFieldColors, 1, 3, soft
}

background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 8
    noise = 0.012
    contrast = 0.9
    brightness = 0.55
    vibrancy = 0.15
}

# Карточка (как .cc: тёмная, скругление, тонкая рамка, тень)
shape {
    monitor =
    size = 420, 330
    color = rgba(24, 22, 22, 0.92)
    rounding = 22
    border_size = 1
    border_color = rgba(197, 201, 197, 0.10)
    shadow_passes = 2
    shadow_size = 12
    shadow_color = rgba(0, 0, 0, 0.55)
    position = 0, 0
    halign = center
    valign = center
}

# Время
label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    color = rgba(230, 226, 204, 1.0)
    font_size = 64
    font_family = JetBrainsMono Nerd Font ExtraBold
    position = 0, 92
    halign = center
    valign = center
}

# Дата
label {
    monitor =
    text = cmd[update:60000] LC_TIME=ru_RU.UTF-8 date +"%A, %-d %B"
    color = rgba(196, 178, 138, 1.0)
    font_size = 13
    font_family = JetBrainsMono Nerd Font Bold
    position = 0, 32
    halign = center
    valign = center
}

# Пользователь
label {
    monitor =
    text = 󰀄  $USER
    color = rgba(115, 124, 115, 1.0)
    font_size = 11
    font_family = JetBrainsMono Nerd Font
    position = 0, 2
    halign = center
    valign = center
}

# Поле пароля (как поле ввода в попапах)
input-field {
    monitor =
    size = 340, 46
    rounding = 12
    outline_thickness = 1
    outer_color = rgba(197, 201, 197, 0.12)
    inner_color = rgba(34, 31, 31, 1.0)
    font_color = rgba(230, 226, 204, 1.0)
    font_family = JetBrainsMono Nerd Font
    check_color = rgba(135, 169, 135, 0.85)
    fail_color = rgba(196, 116, 110, 0.9)
    capslock_color = rgba(196, 178, 138, 0.9)
    dots_size = 0.2
    dots_spacing = 0.35
    dots_center = true
    fade_on_empty = false
    placeholder_text = <span foreground="##737c73">Пароль</span>
    fail_text = <span foreground="##c4746e">Неверный пароль · попытка $ATTEMPTS</span>
    check_text = <span foreground="##87a987">Проверка…</span>
    hide_input = false
    position = 0, -48
    halign = center
    valign = center
}

# Нижняя строка карточки: батарея и раскладка
label {
    monitor =
    text = cmd[update:30000] b=$(ls -d /sys/class/power_supply/BAT* 2>/dev/null | head -n1); [ -n "$b" ] || exit 0; c=$(cat "$b/capacity" 2>/dev/null); s=$(cat "$b/status" 2>/dev/null); [ "$s" = Charging ] && i=󰂄 || i=󰁹; echo "$i $c%"
    color = rgba(166, 166, 156, 1.0)
    font_size = 11
    font_family = JetBrainsMono Nerd Font
    position = -70, -118
    halign = center
    valign = center
}

label {
    monitor =
    text = 󰌌  $LAYOUT
    color = rgba(166, 166, 156, 1.0)
    font_size = 11
    font_family = JetBrainsMono Nerd Font
    position = 70, -118
    halign = center
    valign = center
}
