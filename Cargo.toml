[workspace]
resolver = "3"
members = [
    "crates/inerium-tools",
    "crates/inerium-shell",
    "crates/inerium-greeter",
    "crates/inerium-setup",
    "crates/dolphin-converter",
]
exclude = [
    "standalone/inerium-polkit",
]

[profile.release]
opt-level = 3
lto = "thin"
panic = "abort"
strip = true
