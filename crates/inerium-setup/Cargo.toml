[package]
name = "inerium-setup"
version = "0.1.0"
edition = "2024"

[dependencies]
inerium-i18n = { path = "../inerium-i18n" }
gtk4 = { version = "0.11", features = ["v4_10"] }
gdk4 = "0.11"
glib = "0.22"
gio = "0.22"
vte4 = { version = "0.10", features = ["v0_76"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
